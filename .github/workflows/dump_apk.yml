name: dumpapk
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -qo "$(ls cfdump*.zip | tail -1)"
      - name: Build cf_dump
        run: |
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang++ -std=c++17 -O2 -fPIE -pie -static-libstdc++ src/cf_dump.cpp -o cf_dump
      - name: Build APK
        run: sh build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cf_dump_apk
          path: cf_dump.apk
